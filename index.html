<title>Game center</title>

     EN-TÊTE
====================================================== -->

<header class="header">

    <h1>
        <strong>Game center</strong>
        <span>⚛️</span>
    </h1>

    <p>Jouez dès maintenant</p>

</header>


<!-- =====================================================
     CONTENU PRINCIPAL
====================================================== -->

<main>

    <!-- Recherche -->

    <section class="search-section">

        <input
            type="search"
            id="search"
            placeholder="Rechercher un jeu."
            autocomplete="off"
            aria-label="Rechercher un jeu"
        >

    </section>


    

    <section class="games">

        <h2>
            Jeux
        </h2>

        <div
            id="games"
            class="games"
            aria-label="liste de jeux"
        ></div>

    </section>


</main>



<!-- =====================================================
     GITHUB
====================================================== -->

<a
    href="https://github.com/McAlex4031/Game-Center"
    class="github"
    target="_blank"
    rel="noopener noreferrer"
>
    GitHub
</a>

====================================================== -->
