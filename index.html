<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Game Center : jouez seuls ou avec d'autres joueurs à de nombreux mini-jeux.">

    <meta name="theme-color" content="#101010">

    <title>Game Center</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =====================================================
         EN-TÊTE
    ====================================================== -->

   
<header class="header">

    <div class="header-content">

        <div class="header-title">
            <h1>
                <strong>Game Center</strong>
            </h1>

            <p>Jouez dès maintenant</p>
        </div>

        <!-- Avatar du joueur -->
        <a
            href="profil.html"
            class="profile-avatar"
            id="profile-avatar"
            aria-label="Accéder à mon profil"
            title="Mon profil"
        >
            <span id="profile-avatar-emoji">👾</span>
        </a>

    </div>

</header>

    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main>

        <!-- RECHERCHE -->

        <section class="search-section"
                 aria-label="Rechercher un jeu">

            <input
                type="search"
                id="search"
                placeholder="Rechercher un jeu..."
                autocomplete="off"
                aria-label="Rechercher un jeu"
            >

        </section>


        <!-- LISTE DES JEUX -->

        <section class="games-section"
                 aria-labelledby="games-title">

            <h2 id="games-title">
                Jeux
            </h2>

            <!--
                Les cartes des jeux seront
                générées automatiquement en JavaScript.
            -->

            <div
                id="games"
                class="games-grid"
                aria-label="Liste des jeux"
            >

            </div>

            <!-- Message si aucun jeu ne correspond -->

            <p id="no-games" hidden>
                Aucun jeu trouvé désolé.
            </p>

        </section>

    </main>


    <!-- =====================================================
         LIEN GITHUB
    ====================================================== -->

    <a
        href="https://github.com/McAlex4031/Game-Center"
        class="github"
        target="_blank"
        rel="noopener noreferrer"
    >
        GitHub
